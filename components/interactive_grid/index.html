
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    :root {
        --cell-bg: #151d2f;
        --cell-border: rgba(148, 163, 184, 0.22);
        --cell-text: #f1f5f9;
        --cell-hover-border: #818cf8;
        --cell-hover-bg: #1e293b;
        --selected-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        --selected-border: #c4b5fd;
        --selected-shadow: 0 0 14px rgba(99, 102, 241, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.35);
        --found-gradient: linear-gradient(135deg, #047857 0%, #10b981 100%);
        --found-border: #6ee7b7;
        --found-shadow: 0 0 12px rgba(16, 185, 129, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    body {
        margin: 0;
        padding: 4px;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        background: transparent;
        color: var(--cell-text);
        box-sizing: border-box;
    }

    #grid {
        display: grid;
        gap: 4px;
        width: fit-content;
        max-width: 100%;
        margin: 0 auto;
        padding: 10px;
        background: rgba(17, 24, 39, 0.75);
        border: 1px solid rgba(51, 65, 85, 0.55);
        border-radius: 12px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        user-select: none;
        touch-action: none;
        box-sizing: border-box;
    }

    .cell {
        width: 38px;
        height: 38px;
        display: flex;
        justify-content: center;
        align-items: center;
        border: 1px solid var(--cell-border);
        border-radius: 7px;
        background: var(--cell-bg);
        color: var(--cell-text);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.5px;
        cursor: crosshair;
        box-sizing: border-box;
        transition: transform 0.12s cubic-bezier(0.4, 0, 0.2, 1),
                    background 0.15s ease,
                    border-color 0.15s ease,
                    box-shadow 0.15s ease;
        position: relative;
    }

    .cell:hover {
        background: var(--cell-hover-bg);
        border-color: var(--cell-hover-border);
        transform: scale(1.04);
        z-index: 1;
    }

    .cell.selected {
        background: var(--selected-gradient);
        border-color: var(--selected-border);
        color: #ffffff;
        box-shadow: var(--selected-shadow);
        transform: scale(1.05);
        z-index: 2;
    }

    .cell.found {
        background: var(--found-gradient);
        border-color: var(--found-border);
        color: #ffffff;
        box-shadow: var(--found-shadow);
    }

    .cell.selected.found {
        background: linear-gradient(135deg, #059669 0%, #6366f1 100%);
        border-color: #a7f3d0;
        box-shadow: 0 0 16px rgba(52, 211, 153, 0.65), 0 0 8px rgba(99, 102, 241, 0.5);
    }

    @media (max-width: 600px) {
        .cell {
            width: 30px;
            height: 30px;
            font-size: 13px;
            border-radius: 5px;
        }
        #grid {
            gap: 2px;
            padding: 6px;
        }
    }
</style>
</head>
<body>
<div id="grid"></div>

<script>
    let gridData = [];
    let selected = [];
    let foundPaths = [];
    let dragging = false;
    let startCell = null;
    let lastCell = null;
    let lastSent = "";

    function sendSelection() {
        const payload = JSON.stringify(selected);
        if (payload === lastSent) return;
        lastSent = payload;

        window.parent.postMessage({
            isStreamlitMessage: true,
            type: "streamlit:setComponentValue",
            value: selected
        }, "*");
    }

    function drawGrid() {
        const root = document.getElementById("grid");
        root.innerHTML = "";
        root.style.gridTemplateColumns =
            `repeat(${gridData[0].length}, 38px)`;

        gridData.forEach((row, r) => {
            row.forEach((letter, c) => {
                const cell = document.createElement("div");
                cell.className = "cell";
                cell.textContent = letter;
                cell.dataset.row = r;
                cell.dataset.col = c;

                if (selected.some(p => p[0] === r && p[1] === c)) {
                    cell.classList.add("selected");
                }

                if (foundPaths.some(path =>
                    path.some(p => p[0] === r && p[1] === c)
                )) {
                    cell.classList.add("found");
                }

                cell.addEventListener("pointerdown", event => {
                    event.preventDefault();
                    dragging = true;
                    startCell = [r, c];
                    lastCell = null;
                    selectLine(r, c);
                });

                cell.addEventListener("pointerenter", () => {
                    if (dragging) selectLine(r, c);
                });

                root.appendChild(cell);
            });
        });
    }

    function selectLine(r, c) {
        if (!startCell) return;

        const [sr, sc] = startCell;
        const dr = r - sr;
        const dc = c - sc;

        // Only horizontal, vertical, or diagonal straight lines.
        if (dr !== 0 && dc !== 0 && Math.abs(dr) !== Math.abs(dc)) {
            return;
        }

        if (lastCell && lastCell[0] === r && lastCell[1] === c) {
            return;
        }

        lastCell = [r, c];

        const rowStep = Math.sign(dr);
        const colStep = Math.sign(dc);
        const length = Math.max(Math.abs(dr), Math.abs(dc)) + 1;

        selected = Array.from({length}, (_, i) => [
            sr + i * rowStep,
            sc + i * colStep
        ]);

        drawGrid();
        sendSelection();
    }

    document.addEventListener("pointerup", () => {
        dragging = false;
        startCell = null;
        lastCell = null;
    });

    // Streamlit component protocol.
    function sendReady() {
        window.parent.postMessage({
            isStreamlitMessage: true,
            type: "streamlit:componentReady",
            apiVersion: 1
        }, "*");
    }

    window.addEventListener("message", event => {
        const message = event.data;
        if (!message || !message.type) return;

        if (message.type === "streamlit:render") {
            const args = message.args || {};
            gridData = args.grid || [];
            foundPaths = args.found_paths || [];

            if (gridData.length) {
                drawGrid();
            }

            window.parent.postMessage({
                isStreamlitMessage: true,
                type: "streamlit:setFrameHeight",
                height: document.body.scrollHeight
            }, "*");
        }
    });

    sendReady();
</script>
</body>
</html>
